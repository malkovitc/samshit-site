<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Самшит: прототип магазина</title>
<meta name="robots" content="noindex,nofollow">
<!-- код сайта GoatCounter: https://<КОД>.goatcounter.com; пусто — аналитика выключена -->
<meta name="goatcounter-code" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@200;300;400;500&family=Lilex:wght@200;300;400;500&family=Iosevka+Charon+Mono:wght@300;400;500&family=JetBrains+Mono:wght@200;300;400;500&family=Noto+Sans+Georgian:wght@200;300;400;500&display=swap">
<style>
/* Layout: шапка между двумя линейками, левая колонка меню, справа поле; всё моноширинное, тонкое */
:root{
  --bg:#ffffff; --fg:#141416; --muted:#7a7a84; --hair:#dedee4; --line:#141416;
  --tile:#f2f2f4; --accent:#1f2bd8; --scrim:rgba(20,20,22,.28); --ok:#1f2bd8;
  --mono:"Source Code Pro", "Noto Sans Georgian", ui-monospace, Menlo, monospace;
  --w-body:300; --w-strong:500;
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0f11;--fg:#e9e9ee;--muted:#8d8d98;--hair:#2a2a31;--line:#e9e9ee;--tile:#19191d;--accent:#8a93ff;--scrim:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f11;--fg:#e9e9ee;--muted:#8d8d98;--hair:#2a2a31;--line:#e9e9ee;--tile:#19191d;--accent:#8a93ff;--scrim:rgba(0,0,0,.5);color-scheme:dark}
:root[data-font="lilex"]{--mono:"Lilex", "Noto Sans Georgian", ui-monospace, Menlo, monospace}
:root[data-font="iosevka"]{--mono:"Iosevka Charon Mono", "Noto Sans Georgian", ui-monospace, Menlo, monospace;--w-body:300}
:root[data-font="jetbrains"]{--mono:"JetBrains Mono", "Noto Sans Georgian", ui-monospace, Menlo, monospace;--w-body:200}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-weight:var(--w-body);
  font-size:13px;line-height:1.6;letter-spacing:.01em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
img{max-width:100%;display:block}
button{font:inherit;text-transform:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
.u{text-transform:uppercase;letter-spacing:.08em;font-size:11.5px}
.m{color:var(--muted)}
.tn{font-variant-numeric:tabular-nums}

/* ссылка с прорисовкой подчёркивания */
.ln{background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .35s var(--ease)}
.ln:hover,.ln:focus-visible,.ln[aria-current="page"]{background-size:100% 1px}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px}

/* ---------- шапка ---------- */
.notice{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding-block:6px;color:var(--muted)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;height:24px}
.logo{display:flex;align-items:center;gap:7px;font-weight:var(--w-strong)}
.logo svg{width:13px;height:13px;color:var(--accent);transition:transform .6s var(--ease)}
.logo:hover svg{transform:rotate(-14deg)}
.hr{display:flex;gap:16px;align-items:center}
.cur{display:flex;gap:6px}
.cur button[aria-pressed="true"]{color:var(--fg)}
.cur button{color:var(--muted)}
.count{display:inline-block;min-width:1.2ch;text-align:center}
.count.bump{animation:bump .5s var(--ease)}
@keyframes bump{0%{transform:translateY(0)}35%{transform:translateY(-4px);color:var(--accent)}100%{transform:translateY(0)}}
.burger{display:none}
.mob-only{display:none!important}

/* ---------- каркас ---------- */
.shell{display:grid;grid-template-columns:180px minmax(0,1fr);gap:32px;padding-block:22px 0}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 46px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.side .sub{padding-left:10px;display:flex;flex-direction:column;gap:2px;overflow:hidden;transition:max-height .4s var(--ease),opacity .3s;max-height:0;opacity:0}
nav.side .sub.open{max-height:260px;opacity:1}
nav.side .sep{height:14px}
nav.side a,nav.side>button{align-self:flex-start}
main{min-width:0;min-height:70vh}
.view{animation:enter .55s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rule{border:0;border-top:1px dotted var(--line);margin:0}
.h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:8px 10px}

/* ---------- главная ---------- */
.hero{position:relative;overflow:hidden;background:var(--tile)}
.hero img{width:100%;aspect-ratio:16/8.5;object-fit:cover;object-position:center 40%;animation:reveal 1.1s var(--ease) both}
@keyframes reveal{from{clip-path:inset(0 0 100% 0);transform:scale(1.04)}to{clip-path:inset(0 0 0 0);transform:none}}
.hero .over{position:absolute;left:18px;top:16px;color:#fff;display:flex;flex-direction:column;gap:18px;mix-blend-mode:difference}
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:end;padding-block:28px 10px}
.story p{max-width:52ch;margin:0 0 10px}

/* ---------- сетка товаров ---------- */
.filters{display:flex;flex-wrap:wrap;gap:4px 18px;padding-block:2px 12px}
.filters button{color:var(--muted)}
.filters button[aria-pressed="true"]{color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 14px;padding-block:8px 40px}
.card{display:flex;flex-direction:column;gap:7px;animation:enter .5s var(--ease) both}
.ph{position:relative;background:var(--tile);aspect-ratio:2/3;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s var(--ease),transform 1.2s var(--ease)}
.ph img.b{opacity:0}
.card:hover .ph img.b{opacity:1}
.card:hover .ph img{transform:scale(1.025)}
.qwrap{position:relative;margin-top:-31px;height:31px;overflow:hidden}
.quick{position:absolute;left:0;right:0;bottom:0;display:flex;gap:1px;background:var(--bg);transform:translateY(101%);transition:transform .35s var(--ease)}
.card:hover .quick,.card:focus-within .quick{transform:none}
.quick button{flex:1;height:31px;padding:0;background:var(--bg);border-top:1px solid var(--line)}
.quick button:hover{background:var(--fg);color:var(--bg)}
.quick button:disabled{color:var(--muted);text-decoration:line-through;cursor:default}
.quick button:disabled:hover{background:var(--bg);color:var(--muted)}
.meta{display:flex;justify-content:space-between;gap:10px}
.st{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.st.mto,.st.pre{color:var(--accent)}

/* ---------- карточка ---------- */
.pdp{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;padding-bottom:40px}
.gal{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 46px)}
.thumbs{display:flex;flex-direction:column;gap:6px}
.thumbs button{aspect-ratio:2/3;background:var(--tile);overflow:hidden;opacity:.45;transition:opacity .3s}
.thumbs button[aria-pressed="true"],.thumbs button:hover{opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.stage{background:var(--tile);aspect-ratio:4/5;overflow:hidden;position:relative;cursor:zoom-in}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s var(--ease),transform .5s var(--ease)}
.stage.zoom img{transform:scale(1.8);cursor:zoom-out}
.info{display:flex;flex-direction:column;gap:14px;min-width:0}
.info h1{font-size:15px;font-weight:var(--w-strong);letter-spacing:.06em;text-transform:uppercase;margin:0;line-height:1.35;text-wrap:balance}
.price{font-size:15px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line)}
.modes button{padding:7px 8px;text-align:left;transition:background .25s,color .25s}
.modes button+button{border-left:1px solid var(--line)}
.modes button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.modes button:disabled{color:var(--muted);cursor:default}
.modes small{display:block;font-size:11px;opacity:.75;letter-spacing:.02em;text-transform:none}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes button{min-width:42px;padding:5px 8px;border:1px solid var(--hair);transition:border-color .2s,background .2s,color .2s}
.sizes button:hover{border-color:var(--fg)}
.sizes button[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.sizes button:disabled{color:var(--muted);text-decoration:line-through;cursor:default;border-color:var(--hair)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.add{position:relative;overflow:hidden;width:100%;height:36px;background:var(--fg);color:var(--bg)}
.add span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .45s var(--ease)}
.add .b{transform:translateY(100%)}
.add.done .a{transform:translateY(-100%)}
.add.done .b{transform:none}
.add:disabled{opacity:.35;cursor:default}
.hint{min-height:1.6em;color:var(--accent)}
.serial{border:1px solid var(--accent);color:var(--accent);padding:8px 10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.serial .dots{display:flex;gap:3px;align-items:center}
.serial .dots i{width:6px;height:6px;border:1px solid var(--accent);border-radius:50%}
.serial .dots i.f{background:var(--accent)}
.acc{border-top:1px dotted var(--line)}
.acc details{border-bottom:1px dotted var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:8px 0}
.acc summary::-webkit-details-marker{display:none}
.acc summary i{font-style:normal;transition:transform .3s var(--ease)}
.acc details[open] summary i{transform:rotate(45deg)}
.acc .inner{padding:0 0 12px;max-width:60ch}
.acc .inner p{margin:0 0 8px}
.acc table{border-collapse:collapse;font-size:12px;width:100%}
.acc td,.acc th{border-bottom:1px solid var(--hair);padding:4px 8px 4px 0;text-align:left;font-weight:inherit}
.ask{color:var(--muted)}
.ask:hover{color:var(--fg)}

/* ---------- корзина ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .4s var(--ease);z-index:50}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--bg);z-index:60;
  border-left:1px solid var(--line);transform:translateX(102%);transition:transform .5s var(--ease);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) 18px}
.drawer.open{transform:none}
.drawer .top{display:flex;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 0}
.lines{flex:1;overflow:auto;padding-block:10px;display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;padding-block:12px;border-bottom:1px dotted var(--line);animation:enter .4s var(--ease) both}
.line.out{animation:leave .3s var(--ease) both}
@keyframes leave{to{opacity:0;transform:translateX(16px)}}
.line img{width:64px;aspect-ratio:2/3;object-fit:cover;background:var(--tile)}
.qty{display:inline-flex;border:1px solid var(--hair);margin-top:6px}
.qty button{width:24px}
.qty span{min-width:22px;text-align:center}
.empty{padding-block:30px;color:var(--muted)}
.sum{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.btn{display:flex;align-items:center;justify-content:center;height:36px;background:var(--fg);color:var(--bg);width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--fg)}
.bar{height:1px;background:var(--hair);position:relative;margin:4px 0}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);transition:width .6s var(--ease)}

/* ---------- оформление ---------- */
.co{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:36px;padding-bottom:50px}
.co fieldset{border:0;border-top:1px dotted var(--line);margin:0 0 18px;padding:8px 0 0;min-width:0}
.co legend{padding:0;margin-bottom:8px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.fld label{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
input,select,textarea{font:inherit;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--hair);padding:5px 0;border-radius:0;transition:border-color .25s;width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--fg)}
input:invalid:not(:placeholder-shown){border-color:var(--accent)}
.opt{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--hair);cursor:pointer;align-items:start}
.opt input{width:auto;margin-top:5px;accent-color:var(--fg)}
.opt small{display:block;color:var(--muted)}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 46px);align-self:start;display:flex;flex-direction:column;gap:6px}
.sline{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding-block:8px;border-bottom:1px dotted var(--line)}
.sline img{width:44px;aspect-ratio:2/3;object-fit:cover;background:var(--tile)}
.total{font-weight:var(--w-strong);border-top:1px solid var(--line);padding-top:8px}
.done-box{max-width:60ch;padding-block:40px}
.done-box h1{font-size:15px;font-weight:var(--w-strong);letter-spacing:.06em;text-transform:uppercase;margin:0 0 14px}
.tick{width:40px;height:40px;color:var(--accent);margin-bottom:16px}
.tick path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .8s .2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- текстовые страницы ---------- */
.prose{max-width:62ch;padding-bottom:40px}
.prose p{margin:0 0 12px}
.journal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-bottom:40px}
.journal .ph{aspect-ratio:4/5}

/* ---------- модальное окно ---------- */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:70;pointer-events:none;padding:16px}
.modal .box{background:var(--bg);border:1px solid var(--line);max-width:560px;width:100%;padding:14px 18px 18px;opacity:0;transform:translateY(10px);transition:opacity .35s var(--ease),transform .35s var(--ease)}
.modal.open{pointer-events:auto}
.modal.open .box{opacity:1;transform:none}
.modal table{border-collapse:collapse;width:100%;font-size:12px}
.modal td,.modal th{border-bottom:1px solid var(--hair);padding:5px 8px 5px 0;text-align:left;font-weight:inherit}

/* ---------- подвал и панель шрифта ---------- */
footer{border-top:1px solid var(--line);margin-top:20px;padding-block:10px 80px;display:grid;grid-template-columns:180px minmax(0,1fr);gap:32px}
footer .cols{display:flex;flex-wrap:wrap;gap:6px 22px}
footer form{display:flex;gap:10px;margin-top:14px;max-width:360px}
.tweak{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:45;background:var(--bg);border:1px solid var(--line);padding:6px 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 32px)}
.tweak button{color:var(--muted)}
.tweak button[aria-pressed="true"]{color:var(--accent)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:45;background:var(--fg);color:var(--bg);padding:7px 12px;transform:translateY(160%);transition:transform .45s var(--ease)}
.toast.show{transform:none}

@media (max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){
  .shell,footer{grid-template-columns:minmax(0,1fr)}
  nav.side{position:fixed;top:calc(env(safe-area-inset-top,0px) + 24px);left:0;right:0;z-index:29;background:var(--bg);border-bottom:1px solid var(--line);
    padding:12px max(16px,env(safe-area-inset-left,0px)) 16px;transform:translateY(-120%);transition:transform .45s var(--ease)}
  nav.side.open{transform:none}
  .burger{display:inline}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 10px}
  .pdp,.co,.story{grid-template-columns:minmax(0,1fr)}
  .gal{position:static;grid-template-columns:minmax(0,1fr)}
  .thumbs{flex-direction:row;order:2}
  .thumbs button{width:48px}
  .summary{position:static;order:-1}
  .journal{grid-template-columns:minmax(0,1fr)}
  .quick{transform:none;position:static;border:0}
  .hr .cur{display:none}
  .notice{gap:2px 12px;font-size:10px;padding-block:4px}
  .notice span:nth-child(2){display:none}
  .tweak{gap:4px 10px;padding:4px 8px;font-size:10px}
  .tweak .m{display:none}
  .mob-only{display:flex!important;gap:10px;flex-wrap:wrap;padding-bottom:10px}
  .qwrap{margin-top:0;height:auto;overflow:visible}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

</svg>

<div class="notice u"><span data-t="Доставка по миру · DHL Express"></span><span data-t="Тбилиси · курьер и примерка в мастерской"></span><span style="color:var(--accent)" data-t="Прототип: цены, остатки, сроки и тиражи — заглушки"></span></div>
<header>
  <a class="logo u" href="#home"><svg aria-hidden="true"><use href="#sprig"/></svg><span data-t="Самшит"></span></a>
  <div class="hr u">
    <div class="cur" role="group" aria-label="Language">
      <button data-lang="ru" aria-pressed="true">RU</button><button data-lang="en" aria-pressed="false">EN</button><button data-lang="ka" aria-pressed="false">GE</button>
    </div>
    <div class="cur" role="group" aria-label="Currency">
      <button data-cur="USD" aria-pressed="true">USD</button><button data-cur="GEL" aria-pressed="false">GEL</button><button data-cur="EUR" aria-pressed="false">EUR</button>
    </div>
    <button class="ln" id="openCart"><span data-t="Корзина"></span> — <span class="count tn" id="count">0</span></button>
    <button class="burger" id="burger" aria-expanded="false" data-t="Меню"></button>
  </div>
</header>

<div class="shell">
  <nav class="side u" id="side">
    <div class="cur mob-only" role="group" aria-label="Language"><button data-lang="ru">RU</button><button data-lang="en">EN</button><button data-lang="ka">GE</button><span class="m">·</span><button data-cur="USD">USD</button><button data-cur="GEL">GEL</button><button data-cur="EUR">EUR</button></div>
    <a class="ln" href="#shop" data-nav="shop" data-t="Магазин"></a>
    <div class="sub" id="subcats"></div>
    <a class="ln" href="#workshop" data-nav="workshop" data-t="Мастерская"></a>
    <a class="ln" href="#about" data-nav="about" data-t="О бренде"></a>
    <div class="sep"></div>
    <button class="ln" style="text-align:left" data-open-sizes data-t="Размеры"></button>
    <a class="ln" href="#delivery" data-nav="delivery" data-t="Доставка и возврат"></a>
    <a class="ln" href="#contact" data-nav="contact" data-t="Контакты"></a>
  </nav>
  <main id="app" aria-live="polite"></main>
</div>

<footer class="u">

try{
  cart = JSON.parse(localStorage.getItem("samshit-cart")||"[]");

const later = m => m==="mto"||m==="mtm";
const money = usd => { const step = cur==="GEL"?5:1; const v = Math.round(usd*RATE[cur]/step)*step; return SIGN[cur]+" "+v.toLocaleString(lang==="ka"?"ka-GE":lang==="en"?"en-US":"ru-RU"); };

  $("#subcats").innerHTML = [["all","Все"],...Object.entries(CATS)].map(([k,v])=>`<a class="ln" href="#${k==="all"?"shop":"cat-"+k}">${t(v)}</a>`).join("");

/* ---------- маршруты ---------- */
let filter = {cat:"all", st:"all"};
function route(keepScroll){
  const h = location.hash.slice(1) || "home";
  closeMenu(); closeCart(); closeSizes();
  let view;
  if (h==="home") view = home();
  else if (h==="shop") { filter.cat = "all"; view = shop(); }
  else if (h.startsWith("cat-") && CATS[h.slice(4)]) { filter.cat = h.slice(4); view = shop(); }
  else if (h.startsWith("p-") && byId(h.slice(2))) view = product(byId(h.slice(2)));
  else if (h==="checkout") view = checkout();
  else if (["workshop","about","delivery","contact"].includes(h)) view = page(h);
  else view = home();
  const y = scrollY;
  app.innerHTML = `<div class="view">${view}</div>`;
  bindView(h);
  const inShop = h==="shop"||h.startsWith("cat-")||h.startsWith("p-");
  document.querySelectorAll("[data-nav]").forEach(a => a.setAttribute("aria-current", (a.dataset.nav===h || (a.dataset.nav==="shop" && inShop)) ? "page" : "false"));
  $("#subcats").classList.toggle("open", inShop);
  window.scrollTo({top: keepScroll ? y : 0});
  if (!keepScroll) track("/" + (h==="home"?"":h) + location.search, t("Самшит") + " · " + h);
}
window.addEventListener("hashchange", () => route(false));

function bindView(h){

  const reset = app.querySelector("[data-reset]"); if (reset) reset.onclick=()=>{ filter.st="all"; location.hash="#shop"; };
  if (h.startsWith("p-")) bindProduct(byId(h.slice(2)));
  if (h==="checkout") bindCheckout();
}
function bindProduct(p){
  if (!p) return;
  const stage = $("#stage"), sizes = $("#sizes"), add = $("#add"), label = $("#addLabel"), hint = $("#hint");
  const paint = () => {
    if (sel.mode==="mtm") sel.size = "MTM";
    else if (sel.size==="MTM") sel.size = null;
    $("#sizeBox").hidden = sel.mode==="mtm";
    $("#price").textContent = money(p.usd + (sel.mode==="mtm"?MTM:0));
    app.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.mode===sel.mode));
    const ok = s => sel.mode!=="stock" || !!p.stock[s];
    sizes.innerHTML = SIZES.map(s=>`<button data-size="${s}" aria-pressed="${sel.size===s}" ${ok(s)?"":"disabled"}>${s}</button>`).join("");
    add.disabled = !sel.size;
    label.textContent = !sel.size ? t("Выберите размер") : p.pre ? t("Предзаказ · {s}",{s:sel.size}) : sel.mode==="mto" ? t("Сшить в размере {s}",{s:sel.size}) : sel.mode==="mtm" ? t("Сшить по моим меркам") : t("В корзину · {s}",{s:sel.size});
    hint.textContent = sel.mode==="stock" && sel.size && p.stock[sel.size]===1 ? t("Последняя в этом размере") : sel.mode==="mtm" ? t("После оплаты мастер попросит шесть замеров или пригласит на примерку в Тбилиси") : "";
  };
  sizes.onclick = e => { const b = e.target.closest("button[data-size]"); if(!b||b.disabled) return; sel.size=b.dataset.size; paint(); };
  app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ if(b.disabled) return; sel.mode=b.dataset.mode; if(sel.mode==="stock"&&!p.stock[sel.size]) sel.size=null; paint(); });
  app.querySelectorAll("[data-thumb]").forEach(b=>b.onclick=()=>{
    const img = stage.querySelector("img"); img.style.opacity=0;
    setTimeout(()=>{ img.src = IMG(p.imgs[+b.dataset.thumb]); img.style.opacity=1; },220);
    app.querySelectorAll("[data-thumb]").forEach(x=>x.setAttribute("aria-pressed", x===b));
  });
  stage.onclick = () => stage.classList.toggle("zoom");
  stage.onmousemove = e => { if(!stage.classList.contains("zoom")) return; const r=stage.getBoundingClientRect(); stage.querySelector("img").style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`; };
  add.onclick = () => {
    addToCart(p.id, sel.mode==="mtm" ? "MTM" : sel.size, p.pre ? "pre" : sel.mode);
    add.classList.add("done");
    setTimeout(()=>{ add.classList.remove("done"); openCart(); }, 900);
  };
  paint();
}
function bindCheckout(){
  const form = $("#co"); if (!form) return;
  const sum = $("#summary"), addr = $("#addr"), note = $("#payNote");
  const repaint = () => {
    sum.innerHTML = summaryHtml();
    addr.hidden = !form.querySelector('input[name=ship][value=world]').checked;
    note.textContent = cart.some(l=>later(l.mode)) ? t("За вещи, которые шьются под вас, сейчас списывается 50%. Остаток спишем, когда вещь будет готова, и пришлём её фото.") : t("Оплата целиком. Чек придёт на почту.");
  };
  form.addEventListener("change", repaint);
  form.addEventListener("submit", e => {
    e.preventDefault();
    const bad = [...form.querySelectorAll("input[required]")].find(i=>!i.checkValidity());
    if (bad) { $("#coErr").textContent = bad.id==="c-email" ? t("Проверьте email: на него придёт подтверждение заказа") : t("Заполните имя и email"); bad.focus(); return; }
    const no = "S-" + String(Date.now()).slice(-5);
    track("event/order", "order", true);
    const email = $("#c-email").value;
    cart = []; save(); renderCart();
    app.innerHTML = `<div class="view done-box"><svg class="tick" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M8 21l8 8 16-17" stroke="currentColor" stroke-width="1.5"/></svg><h1>${t("Заказ {n} принят",{n:no})}</h1><p>${t("Это прототип: оплата не проводилась. В рабочем магазине на {e} придёт подтверждение, а мастер напишет в мессенджер со сроком готовности.",{e:esc(email)})}</p><p><a class="u ln" href="#shop">${t("Вернуться в магазин")}</a></p></div>`;
    scrollTo({top:0});
  });
  repaint();
}

/* ---------- корзина ---------- */
function addToCart(id,size,m){
  const l = cart.find(x=>x.id===id&&x.size===size&&x.mode===m);
  if (l) l.q++; else cart.push({id,size,mode:m,q:1});
  save(); renderCart(true);
  track("event/add-to-cart/" + id + "/" + m, "add-to-cart " + id + " " + m, true);
}
function renderCart(bump){
  const n = cart.reduce((s,l)=>s+l.q,0), c = $("#count");
  c.textContent = n;
  if (bump){ c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }
  const lines = $("#lines"), sum = $("#sum");
  if (!cart.length){ lines.innerHTML = `<div class="empty">${t("Корзина пуста.")}<br><a class="ln u" href="#shop" data-close>${t("Перейти в магазин")}</a></div>`; sum.innerHTML=""; return; }
  lines.innerHTML = cart.map((l,i)=>{ const p=byId(l.id); return `<div class="line" data-i="${i}"><a href="#p-${p.id}" data-close><img src="${IMG(p.imgs[0])}" alt=""></a><div><div class="u">${esc(L(p.name))}</div><div class="m">${lineDesc(l)}</div><div class="qty"><button data-dec="${i}" aria-label="−">−</button><span class="tn">${l.q}</span><button data-inc="${i}" aria-label="+">+</button></div></div><div style="text-align:right"><div class="tn">${money(unit(l)*l.q)}</div><button class="ln m u" data-rm="${i}" style="margin-top:8px">${t("Убрать")}</button></div></div>`; }).join("");
  const sub = cart.reduce((s,l)=>s+unit(l)*l.q,0), mto = cart.some(l=>later(l.mode));
  sum.innerHTML = `<div class="row"><span class="u">${t("Сумма")}</span><span class="tn">${money(sub)}</span></div>
    <div class="m">${mto?t("Вещи, которые шьются под вас: сейчас 50%, остаток при готовности. "):""}${t("Доставка считается на следующем шаге, по Тбилиси самовывоз бесплатно.")}</div>
    <a class="btn u" href="#checkout" data-close>${t("Оформить заказ")}</a><button class="btn ghost u" id="keep">${t("Продолжить покупки")}</button>`;
  $("#keep").onclick = closeCart;
}
$("#lines").addEventListener("click", e=>{
  const b = e.target.closest("button,a"); if(!b) return;
  if (b.dataset.close!==undefined) { closeCart(); return; }
  const i = +(b.dataset.inc ?? b.dataset.dec ?? b.dataset.rm);
  if (b.dataset.inc!==undefined){ cart[i].q++; save(); renderCart(true); }
  else if (b.dataset.dec!==undefined){ if(cart[i].q>1){cart[i].q--; save(); renderCart();} else remove(i); }
  else if (b.dataset.rm!==undefined) remove(i);
});
$("#sum").addEventListener("click", e=>{ if(e.target.closest("[data-close]")) closeCart(); });
function remove(i){ const el = $(`.line[data-i="${i}"]`); if (el) el.classList.add("out"); setTimeout(()=>{ cart.splice(i,1); save(); renderCart(); if(location.hash==="#checkout") route(true); },280); }
function openCart(){ $("#drawer").classList.add("open"); $("#scrim").classList.add("open"); $("#drawer").setAttribute("aria-hidden","false"); }
function closeCart(){ $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); $("#drawer").setAttribute("aria-hidden","true"); }
$("#openCart").onclick = () => { openCart(); track("event/open-cart", "open-cart", true); };
$("#closeCart").onclick = closeCart; $("#scrim").onclick = ()=>{ closeCart(); closeSizes(); };

/* быстрое добавление из сетки */
app.addEventListener("click", e=>{
  const b = e.target.closest("[data-quick]"); if(!b) return;
  const p = byId(b.dataset.quick);
  addToCart(p.id, b.dataset.size, mode(p));
  toast(t("{n}: в корзине",{n:L(p.name).split(" — ")[0] + ", " + b.dataset.size}));
});

/* таблица размеров */
function openSizes(){ $("#sizesModal").classList.add("open"); $("#scrim").classList.add("open"); }
function closeSizes(){ $("#sizesModal").classList.remove("open"); if(!$("#drawer").classList.contains("open")) $("#scrim").classList.remove("open"); }
document.addEventListener("click", e=>{ if(e.target.closest("[data-open-sizes]")) openSizes(); if(e.target.closest("[data-close-sizes]")||e.target===$("#sizesModal")) closeSizes(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeCart(); closeSizes(); closeMenu(); } });

/* меню на телефоне */
function closeMenu(){ $("#side").classList.remove("open"); $("#burger").setAttribute("aria-expanded","false"); }
$("#burger").onclick = ()=>{ const o = $("#side").classList.toggle("open"); $("#burger").setAttribute("aria-expanded", o); };

/* язык и валюта */
const rerender = () => { save(); applyStatic(); renderCart(); route(true); };
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; rerender(); track("event/lang/"+lang, "lang "+lang, true); });
document.querySelectorAll("[data-cur]").forEach(b=>b.onclick=()=>{ cur=b.dataset.cur; rerender(); });

/* шрифт */
document.querySelectorAll("[data-font]").forEach(b=>b.onclick=()=>{
  document.documentElement.dataset.font = b.dataset.font;
  document.querySelectorAll("[data-font]").forEach(x=>x.setAttribute("aria-pressed", x===b));
  try{ localStorage.setItem("samshit-font", b.dataset.font); }catch(e){}
});
try{ const f = localStorage.getItem("samshit-font"); if(f){ const b=document.querySelector(`[data-font="${f}"]`); if(b) b.click(); } }catch(e){}

/* подписка */
$("#sub").addEventListener("submit", e=>{ e.preventDefault(); toast(t("Подписка оформлена. В прототипе письмо не отправляется")); $("#subEmail").value=""; });

let tt; function toast(s){ const el=$("#toast"); el.textContent=s; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),2200); }

applyStatic(); renderCart(); route(false);
})();
</script>
</body>
</html>
